name: talla-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: talla
      POSTGRES_USER: talla_migration
      POSTGRES_PASSWORD: talla_migration_local
      TALLA_APP_DB_PASSWORD: talla_app_local
    ports:
      - '127.0.0.1:55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U talla_migration -d talla']
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - talla-postgres:/var/lib/postgresql/data

volumes:
  talla-postgres:
